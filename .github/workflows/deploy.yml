# Publie le dossier site/ sur GitHub Pages à chaque modification.
# Aucun secret nécessaire. Site : https://airnod.github.io/gta6-pc-veille/
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  # Rafraîchit le classement depuis PortWatch VI toutes les heures
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Récupérer le classement à jour de PortWatch VI
        continue-on-error: true
        run: |
          curl -fsSL --max-time 30 -A "gta6-pc-veille (airnod.github.io)" -o /tmp/portwatch.json "https://portwatch-vi.xyz/data/tracker.json?t=$(date +%s)"
          python3 scripts/sync_portwatch.py /tmp/portwatch.json /tmp/tracker.json
          python3 scripts/validate_tracker.py /tmp/tracker.json && cp /tmp/tracker.json site/tracker.json

      - name: Valider les données
        run: |
          python3 scripts/validate_reports.py site/reports.json
          python3 scripts/validate_tracker.py site/tracker.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # GitHub perd parfois l'artefact juste après l'envoi : on réessaie une fois
      - name: Attendre avant nouvel essai
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
